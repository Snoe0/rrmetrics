name = "tradingjournal"
main = "workers/src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Static assets served by Cloudflare Workers
assets = { directory = "public" }

# Environment variables (secrets set via wrangler secret put)
[vars]
APP_URL = "https://rrmetrics.com"
SUPABASE_URL = "https://pmvrsprcwolttzdvuuyp.supabase.co"
# Tradovate OAuth — set the secrets via: wrangler secret put TRADOVATE_CLIENT_ID
#                                          wrangler secret put TRADOVATE_CLIENT_SECRET

[triggers]
crons = ["0 * * * *"]

# ─── Dev environment ───────────────────────────────────
# Deploy:   npm run deploy:dev
# Secrets:  wrangler secret put SECRET_NAME --env dev
# URL:      https://tradingjournal-dev.<your-subdomain>.workers.dev
[env.dev]
name = "tradingjournal-dev"
[env.dev.vars]
APP_URL = "https://tradingjournal-dev.<your-subdomain>.workers.dev"
SUPABASE_URL = "https://pmvrsprcwolttzdvuuyp.supabase.co"
