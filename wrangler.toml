name = "tradingjournal"
main = "workers/src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Static assets served by Cloudflare Workers
assets = { directory = "public" }

# Environment variables (secrets set via wrangler secret put)
[vars]
APP_URL = "https://rrmetrics.com"
PRICE_PRO = "15"
PRICE_ELITE = "22"
TRIAL_DAYS = "14"
SUPABASE_URL = "https://pmvrsprcwolttzdvuuyp.supabase.co"

# Migrations to delete old Durable Object classes
[[migrations]]
tag = "v1"
new_classes = ["SessionDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["UserDataDO"]

[[migrations]]
tag = "v3"
deleted_classes = ["SessionDO", "UserDataDO"]
